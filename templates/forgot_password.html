<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recuperar contraseña · ZYMA 360</title><link rel="stylesheet" href="{{ url_for('static',filename='auth.css') }}"></head>
<body><main class="auth-shell compact"><section class="auth-brand"><img src="{{ url_for('static',filename='zyma-360-logo.png') }}" alt="ZYMA 360"><span class="eyebrow">ACCESO SEGURO</span><h1>Recuperar contraseña</h1><p>Coal Mining AI Copilot</p></section><section class="auth-card"><div><span class="eyebrow">RECUPERACIÓN</span><h2>Recupera tu acceso</h2><p>Te enviaremos un enlace seguro si el correo está registrado.</p></div><form id="forgot_form"><label>Correo electrónico<input id="email" type="email" autocomplete="email" required autofocus></label><button id="submit" type="submit">Enviar enlace</button><div class="message" id="message" role="status"></div></form><p class="auth-link"><a href="{{ url_for('login') }}">Volver a iniciar sesión</a></p></section></main>
<script>const form=document.getElementById('forgot_form'),button=document.getElementById('submit'),message=document.getElementById('message');form.addEventListener('submit',async event=>{event.preventDefault();button.disabled=true;try{const response=await fetch('/api/auth/forgot-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value})});const body=await response.json();if(!response.ok)throw new Error(body.error);message.textContent=body.message;message.className='message ok';form.reset()}catch(error){message.textContent=error.message;message.className='message error'}finally{button.disabled=false}});</script></body></html>
