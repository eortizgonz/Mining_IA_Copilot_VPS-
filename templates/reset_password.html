<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nueva contraseña · ZYMA 360</title><link rel="stylesheet" href="{{ url_for('static',filename='auth.css') }}"></head>
<body><main class="auth-shell compact"><section class="auth-brand"><img src="{{ url_for('static',filename='zyma-360-logo.png') }}" alt="ZYMA 360"><span class="eyebrow">ACCESO SEGURO</span><h1>Nueva contraseña</h1><p>Coal Mining AI Copilot</p></section><section class="auth-card"><div><span class="eyebrow">RECUPERACIÓN</span><h2>Define tu contraseña</h2></div>{% if valid %}<p>Utiliza al menos 10 caracteres.</p><form id="reset_form"><label>Nueva contraseña<input id="password" type="password" minlength="10" autocomplete="new-password" required autofocus></label><label>Confirmar contraseña<input id="confirm" type="password" minlength="10" autocomplete="new-password" required></label><button id="submit" type="submit">Actualizar contraseña</button><div class="message" id="message" role="status"></div></form>{% else %}<div class="message error show">Este enlace es inválido, expiró o ya fue utilizado.</div>{% endif %}<p class="auth-link"><a href="{{ url_for('login') }}">Volver a iniciar sesión</a></p></section></main>
{% if valid %}<script>const form=document.getElementById('reset_form'),button=document.getElementById('submit'),message=document.getElementById('message');form.addEventListener('submit',async event=>{event.preventDefault();const password=document.getElementById('password').value;if(password!==document.getElementById('confirm').value){message.textContent='Las contraseñas no coinciden.';message.className='message error';return}button.disabled=true;try{const response=await fetch('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token:{{ token|tojson }},password})});const body=await response.json();if(!response.ok)throw new Error(body.error);message.textContent=body.message+' Redirigiendo…';message.className='message ok';setTimeout(()=>location.href='/login',1600)}catch(error){message.textContent=error.message;message.className='message error'}finally{button.disabled=false}});</script>{% endif %}</body></html>
